<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña</title>
    <link rel="stylesheet" href="../css/nuevacontrasena.css">
    <link rel="icon" type="image/png" href="../../img/menu/logo.png" sizes="16x16">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>Nueva Contraseña</h1>

            <div id="formContainer">
                <form id="nuevaContrasenaForm">
                    <div class="form-group">
                        <label for="nuevaContrasena">Nueva contraseña</label>
                        <input type="password" id="nuevaContrasena" name="nuevaContrasena" placeholder="Nueva contraseña">
                        <p class="error-message" id="nuevaContrasenaError"></p>
                    </div>

                    <div class="form-group">
                        <label for="repetirContrasena">Repetir contraseña</label>
                        <input type="password" id="repetirContrasena" name="repetirContrasena" placeholder="Repite la contraseña">
                        <p class="error-message" id="repetirContrasenaError"></p>
                    </div>

                    <button type="submit">Guardar contraseña</button>
                </form>
            </div>

            <div class="links">
                <a href="index.html">Volver al inicio</a>
            </div>
        </div>
    </div>

  <!-- AQUI VA EL JS -->
</body>
</html>
