<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleos</title>
    <link rel="icon" type="image/png" href="../../img/menu/logo.png" sizes="16x16">
    <link rel="stylesheet" href="../css/empleos.css">
</head>

<body>
    <!-- Menu -->
    <div id="menu-container"></div>

    <main>
        <!-- Banner -->
        <div class="banner">
            <img src="../../img/web/hero_empleos.png" alt="Banner de empleos">
        </div>

        <!-- Filter -->
        <div class="tabs">
            <div class="tab active" data-filtro="todos">Vacantes</div>
            <div class="tab" data-filtro="cocinero">Cocineros</div>
            <div class="tab" data-filtro="camarero">Camareros</div>
        </div>

        <!-- Empleos -->
        <section class="jobs-section">
            <div class="container">
                <div class="job-list"></div>
                <div class="pagination"></div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../js/cargamenuyfooter.js"></script>
    <script src="../js/empleos.js"></script>
</body>

</html>
