<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Perfil Camarero</title>
    <link rel="stylesheet" href="../css/perfilcamarero.css" />
    <link rel="icon" type="image/png" href="../../img/menu/logo.png" sizes="16x16" />
</head>
<body>

    <!-- Menu Component -->
    <div id="menu-container"></div>

    <div class="main-container">
        <main class="content">

            <!-- Perfil del camarero -->
            <div class="profile-section">
                <div class="profile-header">
                    <div class="profile-avatar"></div>
                    <div class="profile-info">
                        <h2></h2>
                        <div class="profile-type"></div>
                        <div class="profile-details"></div>
                    </div>
                    <button class="edit-profile-btn">Editar Perfil</button>
                </div>
            </div>

            <!-- Tabs de guardados -->
            <div class="section-header">
                <h3 class="section-title">Guardados</h3>
                <div class="tab-buttons">
                    <button class="tab-btn active">Recetas</button>
                    <button class="tab-btn">Restaurantes</button>
                </div>
            </div>

            <!-- Grid de favoritos -->
            <div class="recipes-section">
                <div class="recipes-grid" id="favoritos-grid"></div>
            </div>

        </main>
    </div>

    <!-- Footer Component -->
    <div id="footer-container"></div>

    <!-- JavaScript -->
    <script src="../js/cargamenuyfooter.js"></script>
    <script src="../js/perfilcamarero.js"></script>

</body>
</html>
