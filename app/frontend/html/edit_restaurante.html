<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil del Restaurante</title>
    <link rel="stylesheet" href="../css/editarperfilrestaurantes.css">
    <link rel="icon" type="image/png" href="../../img/menu/logo.png" sizes="16x16">
</head>
<body>
    <!-- Menu -->
    <div id="menu-container"></div>

    <div class="container">
        <div class="header">
            <h1>✏️ Editar Perfil del Restaurante</h1>
            <p>Actualiza la información de tu restaurante para que los clientes tengan los datos más recientes</p>
        </div>

        <form class="form-container" id="restaurant-form">
            <!-- Información Básica -->
            <div class="form-section">
                <h2 class="section-title">🏪 Información Básica</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="restaurant-name">🍽️ Nombre del Restaurante</label>
                        <input type="text" id="restaurant-name" name="restaurant-name">
                    </div>
                    <div class="form-group">
                        <label for="cuisine-type">🍳 Tipo de Cocina</label>
                        <select id="cuisine-type" name="cuisine-type">
                            <option value="">Selecciona un tipo</option>
                            <option value="italiana">Italiana</option>
                            <option value="española">Española</option>
                            <option value="mexicana">Mexicana</option>
                            <option value="china">China</option>
                            <option value="japonesa">Japonesa</option>
                            <option value="francesa">Francesa</option>
                            <option value="mediterranea">Mediterránea</option>
                            <option value="fusion">Fusión</option>
                            <option value="vegetariana">Vegetariana</option>
                            <option value="otra">Otra</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label for="description">📝 Descripción</label>
                        <textarea id="description" name="description" placeholder="Describe tu restaurante, especialidades, ambiente, etc."></textarea>
                    </div>
                </div>
            </div>

            <!-- Ubicación y Contacto -->
            <div class="form-section">
                <h2 class="section-title">📍 Ubicación y Contacto</h2>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="address">🏠 Dirección Completa</label>
                        <input type="text" id="address" name="address">
                    </div>
                    <div class="form-group">
                        <label for="phone">📞 Teléfono</label>
                        <input type="tel" id="phone" name="phone" placeholder="+34 911 111 111">
                    </div>
                    <div class="form-group">
                        <label for="email">✉️ Email</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="form-group full-width">
                        <label for="website">🌐 Sitio Web</label>
                        <input type="text" id="website" name="website" placeholder="www.turestaurante.com">
                    </div>
                </div>
            </div>

            <!-- Rango de Precios -->
            <div class="form-section">
                <h2 class="section-title">💰 Rango de Precios</h2>
                <div class="price-range">
                    <label><input type="radio" name="price-range" value="€"> € (Económico)</label>
                    <label><input type="radio" name="price-range" value="€€"> €€ (Moderado)</label>
                    <label><input type="radio" name="price-range" value="€€€"> €€€ (Alto)</label>
                    <label><input type="radio" name="price-range" value="€€€€"> €€€€ (Lujo)</label>
                </div>
            </div>

            <!-- Imágenes -->
            <div class="form-section">
                <h2 class="section-title">📸 Imágenes</h2>
                <div class="form-group">
                    <label>🖼️ Imagen Principal</label>
                    <div class="image-upload" onclick="document.getElementById('cover-image').click()">
                        <span class="upload-icon">📷</span>
                        <div class="upload-text">
                            <strong>Subir imagen de portada</strong><br>
                            Arrastra una imagen o haz clic para seleccionar
                        </div>
                        <input type="file" id="cover-image" name="cover-image" accept="image/*">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>🎨 Galería de Imágenes</label>
                    <div class="gallery-manager" id="gallery-container">
                        <!-- Se insertan dinámicamente -->
                    </div>
                </div>
            </div>

            <!-- Acciones -->
            <div class="actions">
                <button type="button" class="btn btn-outline" onclick="volverAlPerfil()">⬅️ Volver</button>
                <button type="submit" class="btn btn-primary">💾 Guardar Cambios</button>
            </div>
        </form>
    </div>

     <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../js/cargamenuyfooter.js"></script>
    <script src="../js/edit_restaurante.js"></script>
</body>
</html>
