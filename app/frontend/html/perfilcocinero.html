<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil Cocinero</title>
    <link rel="stylesheet" href="../css/perfilcocinero.css" />
    <link rel="icon" type="image/png" href="../../img/menu/logo.png" sizes="16x16" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
    <!-- Menu component -->
    <div id="menu-container"></div>

    <main>
        <!-- Perfil -->
        <section class="profile-section">
            <div class="container profile-header">
                <div class="profile-avatar"></div>
                <div class="profile-info">
                    <h2>Persona o Empresa</h2>
                    <div class="profile-type">Tipo de Cuenta (Camarero/Cocinero/Restaurante)</div>
                    <div class="profile-details">
                        Tipo de Receta | Tipo de restaurante<br>
                        Ubicación: Barcelona<br>
                        Correo: persona@firma.com<br>
                        Teléfono: +34 666 123 456
                    </div>
                </div>
                <button class="edit-profile-btn">Editar Perfil</button>
            </div>

            <div class="container progress-bars">
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 75%"></div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 60%"></div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 90%"></div>
                </div>
            </div>
        </section>

        <!-- Sección lateral y recetas -->
        <div class="main-container container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-item">Guardados</div>
                <div class="sidebar-item active">Recetas</div>
            </aside>

            <!-- Recetas -->
            <section class="content">
                <div class="section-header">
                    <h3 class="section-title">Recetas</h3>
                    <button class="add-recipe-btn">Añadir receta</button>
                </div>

                <div class="recipes-grid">
                    <!-- Tarjetas de receta repetidas -->
                    <!-- Para una implementación dinámica, puedes usar JS para inyectar este bloque -->
                    <div class="recipe-card">
                        <div class="recipe-image">Imagen del plato</div>
                        <div class="recipe-content">
                            <h4 class="recipe-title">Plato</h4>
                            <div class="recipe-time">Tiempo de receta</div>
                            <div class="recipe-actions">
                                <button class="view-recipe-btn">Ver receta</button>
                                <div class="recipe-icons">
                                    <button class="icon-btn"><i class="fa-solid fa-pen"></i></button>
                                    <button class="icon-btn"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Repite o genera dinámicamente más recipe-card aquí -->
                </div>
            </section>
        </div>

        <!-- Popup para añadir receta -->
        <div id="add-recipe-popup" class="popup-container">
            <div class="popup-content">
                <span class="close-popup">&times;</span>
                <h2>Añadir Nueva Receta</h2>
                <form id="recipe-form" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="recipe-title">Título:</label>
                        <input type="text" id="recipe-title" name="title" required>
                    </div>

                    <div class="form-group">
                        <label for="recipe-type">Tipo de receta:</label>
                        <select id="recipe-type" name="type" required>
                            <option value="Entrante">Entrante</option>
                            <option value="Plato Principal">Plato Principal</option>
                            <option value="Postre">Postre</option>
                            <option value="Vegetariano">Vegetariano</option>
                            <option value="Sin Gluten">Sin Gluten</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="recipe-description">Descripción:</label>
                        <textarea id="recipe-description" name="description" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="recipe-ingredients">Ingredientes (separados por comas):</label>
                        <textarea id="recipe-ingredients" name="ingredients" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="recipe-steps">Pasos (separados por saltos de línea):</label>
                        <textarea id="recipe-steps" name="steps" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="recipe-time">Tiempo de preparación (minutos):</label>
                        <input type="number" id="recipe-time" name="time" required>
                    </div>

                    <div class="form-group">
                        <label for="recipe-portions">Porciones:</label>
                        <input type="number" id="recipe-portions" name="portions" required>
                    </div>

                    <div class="form-group">
                        <label for="recipe-difficulty">Dificultad:</label>
                        <select id="recipe-difficulty" name="difficulty" required>
                            <option value="Fácil">Fácil</option>
                            <option value="Media">Media</option>
                            <option value="Difícil">Difícil</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="recipe-image">Imagen de la receta:</label>
                        <input type="file" id="recipe-image" name="image" accept="image/*">
                    </div>

                    <h3>Información Nutricional</h3>
                    <div class="form-group">
                        <label for="recipe-calories">Calorias</label>
                        <input type="number" id="recipe-calories" name="calories" required>
                    </div>

                    <div class="form-group">
                        <label for="recipe-proteins">Proteinas (g)</label>
                        <input type="number" id="recipe-proteins" name="proteins" required>
                    </div>

                    <div class="form-group">
                        <label for="recipe-carbohydrates">Carbohidratos (g)</label>
                        <input type="number" id="recipe-carbohydrates" name="carbohydrates" required>
                    </div>

                    <div class="form-group">
                        <label for="recipe-fats">Grasas (g)</label>
                        <input type="number" id="recipe-fats" name="fats" required>
                    </div>

                    <button type="submit" class="submit-btn">Guardar Receta</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer component -->
    <div id="footer-container"></div>

    <!-- JavaScript -->
    <script src="../js/cargamenuyfooter.js"></script>
    <!-- <script src="../js/crear_receta.js"></script> -->
    <script src="../js/perfilcocinero.js"></script>
    <!-- <script src="../js/perfilcamarero.js"></script> -->
    <!-- <script src="../js/perfilrestaurante.js"></script> -->
</body>

</html>
