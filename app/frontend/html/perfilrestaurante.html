<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil restaurantes</title>
    <link rel="stylesheet" href="../css/perfilrestaurante.css">
    <link rel="icon" type="image/png" href="../../img/menu/logo.png" sizes="16x16" />

</head>

<body>
    <!-- Menú cargado dinámicamente -->
    <div id="menu-container"></div>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-item">Guardados</div>
            <div class="sidebar-item">Recetas</div>
            <div class="sidebar-item active">Empresas</div>
        </aside>

        <main class="content">
            <div class="profile-section">
                <div class="profile-header">
                    <div class="profile-avatar"></div>
                    <div class="profile-info">
                        <h2>Persona o Empresa</h2>
                        <div class="profile-type">Tipo de Cuenta (Camarero/Cocinero/Restaurante)</div>
                        <div class="profile-details">
                            Tipo de Receta | Tipo de restaurante<br>
                            Ubicación: Barcelona<br>
                            Correo: persona@firma.com<br>
                            Teléfono: +34 666 123 456
                        </div>
                    </div>
                    <button class="edit-profile-btn">Editar Perfil</button>
                </div>

                <div class="progress-bars">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 75%"></div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 60%"></div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 90%"></div>
                    </div>
                </div>
            </div>

            <div class="section-header">
                <h3 class="section-title">Ofertas</h3>
                <button class="add-oferta-btn">Añadir oferta</button>
            </div>

            <div class="ofertas-list">
                <div class="oferta-item">
                    <div class="oferta-avatar"></div>
                    <div class="oferta-info">
                        <h4 class="oferta-name">Oferta</h4>
                        <div class="oferta-details">
                            <div class="oferta-detail-line"></div>
                            <div class="oferta-detail-line"></div>
                            <div class="oferta-detail-line"></div>
                            <div class="oferta-detail-line"></div>
                        </div>
                    </div>
                    <div class="oferta-actions">
                        <button class="icon-btn">
                            <i class="icon-edit"></i>
                        </button>
                        <button class="icon-btn">
                            <i class="icon-delete"></i>
                        </button>
                    </div>
                </div>

                <div class="oferta-item">
                    <div class="oferta-avatar"></div>
                    <div class="oferta-info">
                        <h4 class="oferta-name">Empresa</h4>
                        <div class="oferta-details">
                            <div class="oferta-detail-line"></div>
                            <div class="oferta-detail-line"></div>
                            <div class="oferta-detail-line"></div>
                            <div class="oferta-detail-line"></div>
                        </div>
                    </div>
                    <div class="oferta-actions">
                        <button class="icon-btn">
                            <i class="icon-edit"></i>
                        </button>
                        <button class="icon-btn">
                            <i class="icon-delete"></i>
                        </button>
                    </div>
                </div>

                <div class="oferta-item">
                    <div class="oferta-avatar"></div>
                    <div class="oferta-info">
                        <h4 class="oferta-name">Empresa</h4>
                        <div class="oferta-details">
                            <div class="oferta-detail-line"></div>
                            <div class="oferta-detail-line"></div>
                            <div class="oferta-detail-line"></div>
                            <div class="oferta-detail-line"></div>
                        </div>
                    </div>
                    <div class="oferta-actions">
                        <button class="icon-btn">
                            <i class="icon-edit"></i>
                        </button>
                        <button class="icon-btn">
                            <i class="icon-delete"></i>
                        </button>

                        <!-- Popup para añadir oferta -->
                        <div id="add-oferta-popup" class="popup-container">
                            <div class="popup-content">
                                <span class="close-popup">&times;</span>
                                <h2>Añadir Nueva Oferta</h2>
                                <form id="oferta-form" enctype="multipart/form-data">
                                    <div class="form-group">
                                        <label for="oferta-titulo">Título de la oferta:</label>
                                        <input type="text" id="oferta-titulo" name="titulo" required>
                                    </div>

                                    <div class="form-group">
                                        <label for="oferta-tipo">Tipo de puesto:</label>
                                        <select id="oferta-tipo" name="tipo_puesto" required>
                                            <option value="cocinero">Cocinero</option>
                                            <option value="camarero">Camarero</option>
                                        </select>
                                    </div>

                                    <div class="form-group">
                                        <label for="oferta-descripcion">Descripción:</label>
                                        <textarea id="oferta-descripcion" name="descripcion" required></textarea>
                                    </div>

                                    <div class="form-group">
                                        <label for="oferta-requisitos">Requisitos:</label>
                                        <textarea id="oferta-requisitos" name="requisitos" required></textarea>
                                    </div>

                                    <div class="form-group">
                                        <label for="oferta-horario">Horario:</label>
                                        <input type="text" id="oferta-horario" name="horario" required>
                                    </div>

                                    <div class="form-group">
                                        <label for="oferta-salario">Salario (opcional):</label>
                                        <input type="text" id="oferta-salario" name="salario">
                                    </div>

                                    <div class="form-group">
                                        <label for="oferta-beneficios">Beneficios (opcional):</label>
                                        <textarea id="oferta-beneficios" name="beneficios"></textarea>
                                    </div>

                                    <div class="form-group">
                                        <label for="oferta-fecha">Fecha de publicación:</label>
                                        <input type="date" id="oferta-fecha" name="fecha_publicacion" required>
                                    </div>

                                    <div class="form-group">
                                        <label for="oferta-estado">Estado:</label>
                                        <select id="oferta-estado" name="estado" required>
                                            <option value="abierta">Abierta</option>
                                            <option value="cerrada">Cerrada</option>
                                        </select>
                                    </div>

                                    <button type="submit" class="submit-btn">Publicar Oferta</button>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Footer component -->
    <div id="footer-container"></div>

    <!-- JavaScript -->
    <script src="../js/cargamenuyfooter.js"></script>
    <script src="../js/perfilrestaurante.js"></script>
</body>

</html>
