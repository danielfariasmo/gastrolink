<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <link rel="stylesheet" href="../css/editarperfilrestaurantes.css">
    <link rel="icon" type="image/png" href="../../img/menu/logo.png" sizes="16x16">
</head>

<body>
    <!-- Menu -->
    <div id="menu-container"></div>

    <div class="container">
        <div class="header1">
            <h1>✏️ Editar Perfil</h1>
            <p>Actualiza tu información para llegar a más personas</p>
        </div>

        <form class="form-container" id="restaurant-form">
            <!-- Información Básica -->
            <div class="form-section">
                <h2 class="section-title">Información Básica</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="restaurant-name">Nombre</label>
                        <input type="text" id="restaurant-name" name="restaurant-name" placeholder="Luis Perez">
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="correo@correo.com">
                    </div>
                    <div class="form-group">
                        <label for="experiencia">Experiencia</label>
                        <input type="text" id="email" name="Experiencia" placeholder="Ej: 5 años de experiencia">
                    </div>
                    <div class="form-group">
                        <label for="idiomas">Idiomas</label>
                        <input type="text" id="email" name="idiomas" placeholder="Ej: Español, Inglés">
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Descripción</label>
                        <textarea id="description" name="description"
                            placeholder="Cuenta un poco sobre ti mismo."></textarea>
                    </div>
                </div>
            </div>

            <!-- Imágenes -->
            <div class="form-section">
                <h2 class="section-title">Foto de Perfil</h2>
                <div class="form-group">
                    <div class="image-upload" onclick="document.getElementById('cover-image').click()">
                        <span class="upload-icon">📷</span>
                        <div class="upload-text">
                            <strong>Subir imagen de perfil</strong><br>
                            Arrastra una imagen o haz clic para seleccionar
                        </div>
                        <input type="file" id="cover-image" name="cover-image" accept="image/*">
                    </div>
                </div>
            </div>

            <!-- Acciones -->
            <div class="actions">
                <button type="button" class="btn btn-outline" onclick="volverAlPerfil()">⬅️ Volver</button>
                <button type="submit" class="btn btn-primary">💾 Guardar Cambios</button>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../js/cargamenuyfooter.js"></script>
</body>

</html>
