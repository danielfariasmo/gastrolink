<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../img/menu/logo.png" sizes="16x16">
    <link rel="stylesheet" href="../css/detalle_recetas.css">
    <title></title>
</head>

<body>
    <!-- Menu component -->
    <div id="menu-container"></div>

    <div class="container">
        <main class="recipe-detail">
            <div class="recipe-header">
                <h1 class="recipe-title"></h1>
                <p class="recipe-subtitle"></p>

                <div class="recipe-meta">
                    <div class="recipe-meta-item">
                        <span class="recipe-meta-icon">⏱️</span>
                        <span>Tiempo de preparación: <span class="prep-time-value">--</span> minutos</span>
                    </div>
                    <div class="recipe-meta-item">
                        <span class="recipe-meta-icon">🍽️</span>
                        <span>Porciones: <span class="porciones-value">--</span></span>
                    </div>
                    <div class="recipe-meta-item">
                        <span class="recipe-meta-icon">🔥</span>
                        <span>Dificultad: <span class="dificultad-value">--</span></span>
                    </div>
                </div>
            </div>

            <div class="recipe-image-container">
                <img src="" alt="Imagen de la receta" class="recipe-image">
            </div>

            <div class="recipe-content">
                <div class="recipe-sidebar">
                    <div class="recipe-section">
                        <h2 class="recipe-section-title">Ingredientes</h2>
                        <ul class="ingredients-list"></ul>
                    </div>

                    <div class="recipe-section">
                        <h2 class="recipe-section-title">Información Nutricional</h2>
                        <div class="nutrition-list">
                            <div class="nutrition-item">
                                <span class="nutrition-value calorias-value">--</span>
                                <span class="nutrition-label">Calorías</span>
                            </div>
                            <div class="nutrition-item">
                                <span class="nutrition-value proteinas-value">--</span>
                                <span class="nutrition-label">Proteínas</span>
                            </div>
                            <div class="nutrition-item">
                                <span class="nutrition-value carbohidratos-value">--</span>
                                <span class="nutrition-label">Carbohidratos</span>
                            </div>
                            <div class="nutrition-item">
                                <span class="nutrition-value grasas-value">--</span>
                                <span class="nutrition-label">Grasas</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="recipe-main">
                    <div class="recipe-section">
                        <h2 class="recipe-section-title">Elaboración</h2>
                        <ol class="steps-list"></ol>
                    </div>

                    <div class="chef-info">
                        <div class="chef-image">
                            <img src="../../img/miguel.avif" alt="Chef Miguel Rossi">
                        </div>
                        <div class="chef-details">
                            <h3 class="chef-name">Chef Miguel Rossi</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="recipe-actions">
                <button class="action-button imprimir-btn">
                    <span class="action-icon">🖨️</span>
                    Imprimir receta
                </button>
                <button class="action-button guardar-btn">
                    <span class="action-icon">💾</span>
                    Guardar receta
                </button>
                <button class="action-button editar-btn" style="display: none;">
                    <span class="action-icon">✏️</span>
                    Editar receta
                </button>
                <button class="action-button compartir-btn primary">
                    <span class="action-icon">📤</span>
                    Compartir
                </button>
            </div>

            <div class="related-recipes">
                <h2 class="related-title">Recetas relacionadas</h2>
                <div class="related-grid"></div>
            </div>
        </main>
    </div>

    <!-- Popup de edición (oculto por defecto) -->
    <div id="edit-popup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <h2>Editar Receta</h2>
            <form id="edit-recipe-form" class="edit-form">
                <div class="form-group">
                    <label for="edit-title">Título</label>
                    <input type="text" id="edit-title" required>
                </div>

                <div class="form-group">
                    <label for="edit-intro">Introducción</label>
                    <textarea id="edit-intro" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="edit-ingredients">Ingredientes (separados por comas)</label>
                    <textarea id="edit-ingredients" rows="5" required></textarea>
                </div>

                <div class="form-group">
                    <label for="edit-steps">Pasos (uno por línea)</label>
                    <textarea id="edit-steps" rows="8" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-time">Tiempo (min)</label>
                        <input type="number" id="edit-time" required>
                    </div>

                    <div class="form-group">
                        <label for="edit-portions">Porciones</label>
                        <input type="number" id="edit-portions" required>
                    </div>

                    <div class="form-group">
                        <label for="edit-difficulty">Dificultad</label>
                        <select id="edit-difficulty" required>
                            <option value="Fácil">Fácil</option>
                            <option value="Media">Media</option>
                            <option value="Difícil">Difícil</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="edit-image">Cambiar imagen (opcional)</label>
                        <input type="file" id="edit-image" accept="image/*">
                    </div>
                </div>

                <div class="popup-actions">
                    <button type="button" class="action-button cancel-btn">Cancelar</button>
                    <button type="submit" class="action-button primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer component -->
    <div id="footer-container"></div>

    <!-- JavaScript -->
    <script src="../js/cargamenuyfooter.js"></script>
    <script src="../js/detalle_recetas.js"></script>
</body>

</html>
